<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Fashion Products | VirtualCarts</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<!-- Back to Home -->
		<div class="back-container">
			<a href="index.html" class="back-btn">&larr; Back to Home</a>
		</div>

		<!-- Page Title -->
		<section class="categories-section">
			<h2>Fashion Collection</h2>
			<p class="section-subtitle">Bags, Footwear & Accessories</p>
			<div class="section-divider"></div>

			<!-- Products Grid -->
			<div class="product-grid">
				<div class="product-card">
					<img src="./assets/fashion-bag1.png" alt="Leather Bag" />
					<h3>Leather Handbag</h3>
					<p class="product-price">₹2999</p>
					<button class="add-cart-btn">Add to Cart</button>
				</div>

				<div class="product-card">
					<img src="./assets/fashion-shoes1.png" alt="Sneakers" />
					<h3>Casual Sneakers</h3>
					<p class="product-price">₹1999</p>
					<button class="add-cart-btn">Add to Cart</button>
				</div>

				<div class="product-card">
					<img src="./assets/fashion-bag2.png" alt="Backpack" />
					<h3>Travel Backpack</h3>
					<p class="product-price">₹2499</p>
					<button class="add-cart-btn">Add to Cart</button>
				</div>

				<div class="product-card">
					<img src="./assets/fashion-shoes2.png" alt="Heels" />
					<h3>Stylish Heels</h3>
					<p class="product-price">₹2199</p>
					<button class="add-cart-btn">Add to Cart</button>
				</div>

				<div class="product-card">
					<img src="./assets/fashion-bag3.png" alt="Tote Bag" />
					<h3>Canvas Tote Bag</h3>
					<p class="product-price">₹1299</p>
					<button class="add-cart-btn">Add to Cart</button>
				</div>

				<div class="product-card">
					<img src="./assets/fashion-shoes3.png" alt="Boots" />
					<h3>Leather Boots</h3>
					<p class="product-price">₹3499</p>
					<button class="add-cart-btn">Add to Cart</button>
				</div>

				<div class="product-card">
					<img
						src="./assets/fashion-leather-wristWatch.png"
						alt="Wrist Watch"
					/>
					<h3>Classic Wrist Watch</h3>
					<p class="product-price">₹1899</p>
					<button class="add-cart-btn">Add to Cart</button>
				</div>

				<div class="product-card">
					<img src="./assets/fashion-sunglasses.png" alt="Sunglasses" />
					<h3>Stylish Sunglasses</h3>
					<p class="product-price">₹999</p>
					<button class="add-cart-btn">Add to Cart</button>
				</div>
			</div>
		</section>
	</body>
</html>
