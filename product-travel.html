<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Travel Products | VirtualCarts</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<!-- Back to Home -->
		<div class="back-container">
			<a href="index.html" class="back-btn">&larr; Back to Home</a>
		</div>

		<!-- Page Title -->
		<section class="categories-section">
			<h2>Travel Collection</h2>
			<p class="section-subtitle">Bags, Luggage & Travel Essentials</p>
			<div class="section-divider"></div>

			<!-- Products Grid -->
			<div class="product-grid">
				<div class="product-card">
					<img src="./assets/travel-bag.png" alt="Travel Backpack" />
					<h3>Travel Backpack</h3>
					<p class="product-price">₹2999</p>
					<button class="add-cart-btn">Add to Cart</button>
				</div>

				<div class="product-card">
					<img src="./assets/travel-luggages.png" alt="Suitcase" />
					<h3>Hard Shell Suitcase</h3>
					<p class="product-price">₹6999</p>
					<button class="add-cart-btn">Add to Cart</button>
				</div>

				<div class="product-card">
					<img src="./assets/travel-duffle.png" alt="Duffle Bag" />
					<h3>Duffle Bag</h3>
					<p class="product-price">₹2499</p>
					<button class="add-cart-btn">Add to Cart</button>
				</div>

				<div class="product-card">
					<img src="./assets/travel-pouch.png" alt="Travel Organizer" />
					<h3>Travel Organizer</h3>
					<p class="product-price">₹899</p>
					<button class="add-cart-btn">Add to Cart</button>
				</div>

				<div class="product-card">
					<img src="./assets/travel-neckpillow.png" alt="Neck Pillow" />
					<h3>Neck Pillow</h3>
					<p class="product-price">₹799</p>
					<button class="add-cart-btn">Add to Cart</button>
				</div>

				<div class="product-card">
					<img src="./assets/travel-lock.png" alt="Travel Lock" />
					<h3>TSA Travel Lock</h3>
					<p class="product-price">₹499</p>
					<button class="add-cart-btn">Add to Cart</button>
				</div>

				<div class="product-card">
					<img src="./assets/travel-bottle.png" alt="Travel Water Bottle" />
					<h3>Insulated Water Bottle</h3>
					<p class="product-price">₹1299</p>
					<button class="add-cart-btn">Add to Cart</button>
				</div>

				<div class="product-card">
					<img src="./assets/travel-eyemask.png" alt="Eye Mask" />
					<h3>Sleep Eye Mask</h3>
					<p class="product-price">₹599</p>
					<button class="add-cart-btn">Add to Cart</button>
				</div>
			</div>
		</section>
	</body>
</html>
