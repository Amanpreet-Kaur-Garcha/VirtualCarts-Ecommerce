<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Electronics Products | VirtualCarts</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<!-- Back to Home -->
		<div class="back-container">
			<a href="index.html" class="back-btn">&larr; Back to Home</a>
		</div>

		<!-- Page Title -->
		<section class="categories-section">
			<h2>Electronics Collection</h2>
			<p class="section-subtitle">Gadgets, Accessories & Devices</p>
			<div class="section-divider"></div>

			<!-- Products Grid -->
			<div class="product-grid">
				<div class="product-card">
					<img src="./assets/elec-headphones.png" alt="Headphones" />
					<h3>Wireless Headphones</h3>
					<p class="product-price">₹2499</p>
					<button class="add-cart-btn">Add to Cart</button>
				</div>

				<div class="product-card">
					<img src="./assets/electronic-laptop.png" alt="Laptop" />
					<h3>Laptop</h3>
					<p class="product-price">₹54999</p>
					<button class="add-cart-btn">Add to Cart</button>
				</div>

				<div class="product-card">
					<img src="./assets/elec-powerbank.png" alt="Power Bank" />
					<h3>Power Bank</h3>
					<p class="product-price">₹1299</p>
					<button class="add-cart-btn">Add to Cart</button>
				</div>

				<div class="product-card">
					<img src="./assets/elec-smartwatch.png" alt="Smart Watch" />
					<h3>Smart Watch</h3>
					<p class="product-price">₹3999</p>
					<button class="add-cart-btn">Add to Cart</button>
				</div>

				<div class="product-card">
					<img src="./assets/elec-earbuds.png" alt="Earbuds" />
					<h3>Wireless Earbuds</h3>
					<p class="product-price">₹1999</p>
					<button class="add-cart-btn">Add to Cart</button>
				</div>

				<div class="product-card">
					<img src="./assets/elec-mouse.png" alt="Keyboard" />
					<h3>Gaming Mouse</h3>
					<p class="product-price">₹2999</p>
					<button class="add-cart-btn">Add to Cart</button>
				</div>

				<div class="product-card">
					<img src="./assets/elec-speaker.png" alt="Bluetooth Speaker" />
					<h3>Bluetooth Speaker</h3>
					<p class="product-price">₹3499</p>
					<button class="add-cart-btn">Add to Cart</button>
				</div>

				<div class="product-card">
					<img src="./assets/elec-tablet.png" alt="Tablet" />
					<h3>Android Tablet</h3>
					<p class="product-price">₹22999</p>
					<button class="add-cart-btn">Add to Cart</button>
				</div>
			</div>
		</section>
	</body>
</html>
